name: CI — controles qualite

# Chaine de controles executee avant l'integration de toute modification sur master.
# La construction et le deploiement restent assures par Vercel (integration et
# deploiement continus) ; ce workflow porte les controles de qualite du code.
#
# Etat au 22 aout 2026 :
# - documentation : operationnel, 17/17 modules.
# - tests         : operationnel. 87 cas sur 5574 sont aujourd'hui desynchronises
#                   du code et font echouer le job ; c'est precisement ce que la
#                   chaine sert a rendre visible.
# - isolation     : s'execute sur une instance Supabase jetable creee dans le
#                   runner (aucun secret, aucune base reelle sollicitee), en
#                   declenchement manuel tant que T-015 n'est pas traite.
# - analyse statique : operationnel. Les avertissements restent visibles dans le
#                   journal du job ; seules les erreurs le font echouer.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  documentation:
    name: Documentation obligatoire des modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Alignement de npm sur la version du projet
        run: npm install -g npm@11.6.2
      - name: Installation des dependances
        run: npm ci
      - name: Presence de guide.md, faq.md et flows.md dans chaque module
        run: npm run check:docs

  analyse-statique:
    name: Analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Alignement de npm sur la version du projet
        run: npm install -g npm@11.6.2
      - name: Installation des dependances
        run: npm ci
      - name: ESLint
        run: npm run lint

  tests:
    name: Tests unitaires et de contrat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Alignement de npm sur la version du projet
        run: npm install -g npm@11.6.2
      - name: Installation des dependances
        run: npm ci
      - name: Suite de tests (hors isolation multi-tenant)
        run: npx vitest run --exclude 'tests/rls/**'

  # Declenchement manuel uniquement (Actions > Run workflow) tant que T-015 n'est
  # pas traite : les scenarios d'isolation n'avaient jamais ete executes et leur
  # environnement demande un chantier a part. La base se reconstruit desormais de
  # bout en bout — c'est l'attribution des droits aux roles anon/authenticated qui
  # manque sur une instance locale (voir T-015).
  isolation:
    name: Tests d'isolation multi-tenant (RLS)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Alignement de npm sur la version du projet
        run: npm install -g npm@11.6.2
      - name: Installation des dependances
        run: npm ci

      # Les scenarios d'isolation s'executent sur une instance Supabase jetable,
      # creee dans le runner et detruite avec lui : les migrations y sont appliquees
      # depuis supabase/migrations. Aucune base reelle n'est sollicitee, et les cles
      # d'une instance locale etant fixes et publiques, aucun secret n'est necessaire.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Demarrage de l'instance Supabase jetable
        run: supabase start

      - name: Recuperation des acces de l'instance
        run: supabase status -o env | sed 's/"//g' >> "$GITHUB_ENV"


      - name: Scenarios d'acces inter-clients
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
        run: npm run test:rls

      - name: Arret de l'instance
        if: always()
        run: supabase stop --no-backup
