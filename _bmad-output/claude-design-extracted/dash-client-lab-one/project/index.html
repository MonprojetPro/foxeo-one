<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>MonprojetPro — Client Dashboard</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0c;
    --card: #141414;
    --card-2: #1a1a1a;
    --border: #2d2d2d;
    --border-active: #3d3d3d;
    --text: #f9fafb;
    --text-2: #9ca3af;
    --text-3: #6b7280;

    --lab: #7c3aed;
    --lab-light: #a78bfa;
    --lab-bg: #1e1557;
    --lab-border: #3d2d6d;
    --lab-deep: #1a1033;

    --one: #4ade80;
    --one-dark: #16a34a;
    --one-bg: #052e16;
    --one-orange: #fb923c;

    --ok: #22c55e;
    --ok-bg: #0f1f0f;
    --warn: #f59e0b;
    --warn-bg: #1c1404;
    --err: #ef4444;
    --err-bg: #1c0404;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, sans-serif; font-feature-settings: 'cv11', 'ss01'; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
  input, textarea { font-family: inherit; }
  a { color: inherit; text-decoration: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #333; }

  .text-xs { font-size: 11px; }
  .text-sm { font-size: 13px; }
  .text-base { font-size: 15px; }
  .text-lg { font-size: 17px; }
  .text-xl { font-size: 20px; }
  .text-2xl { font-size: 24px; }
  .text-3xl { font-size: 30px; }
  .text-4xl { font-size: 36px; }
  .uppercase { text-transform: uppercase; letter-spacing: 0.08em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }

  /* Badge pill */
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; line-height: 1; }

  /* Card */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 10px 22px; font-size: 13px; font-weight: 600; transition: all 0.15s ease; white-space: nowrap; }
  .btn-lab { background: var(--lab); color: white; }
  .btn-lab:hover { background: #8b4df0; }
  .btn-lab:disabled { background: #2a1f52; color: #6b6584; cursor: not-allowed; }
  .btn-one { background: var(--one-dark); color: white; }
  .btn-one:hover { background: #15b866; }
  .btn-outline-lab { border: 1px solid var(--lab); color: var(--lab-light); background: transparent; }
  .btn-outline-lab:hover { background: rgba(124,58,237,0.1); }
  .btn-outline-one { border: 1px solid var(--one-dark); color: var(--one); background: transparent; }
  .btn-outline-one:hover { background: rgba(22,163,74,0.1); }
  .btn-outline-err { border: 1px solid var(--err); color: var(--err); background: transparent; }
  .btn-outline-err:hover { background: rgba(239,68,68,0.1); }

  /* Focus */
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--lab-light); outline-offset: 2px; }

  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.45); }
    70% { box-shadow: 0 0 0 14px rgba(74, 222, 128, 0); }
    100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
  }
  @keyframes fade-slide-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes grad-arrow {
    from { transform: translateX(-24px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes confetti-fall {
    from { transform: translateY(-40px) rotate(0); opacity: 1; }
    to { transform: translateY(360px) rotate(540deg); opacity: 0; }
  }
  .fade-in { animation: fade-slide-in 0.35s ease both; }
</style>

</head>
<body>

</body>
</html>
